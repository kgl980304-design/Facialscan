name: Bootstrap Distribution Certificate (1회성)

on:
  workflow_dispatch:
    inputs:
      cert_password:
        description: "내보낼 .p12 파일에 설정할 비밀번호 (아무 문자열, 꼭 기억해두세요)"
        required: true

jobs:
  bootstrap:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ruby / Bundler 캐시
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: App Store Connect API 키 디코딩 및 형식 변환
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          mkdir -p private_keys
          ORIGINAL_PATH="private_keys/AuthKey_${ASC_KEY_ID}_original.p8"
          CONVERTED_PATH="private_keys/AuthKey_${ASC_KEY_ID}.p8"
          python3 -c "import base64,os; raw=os.environ['ASC_KEY_CONTENT']; data=''.join(raw.split()); pad=len(data)%4; data=data+('='*(4-pad) if pad else ''); open('${ORIGINAL_PATH}','wb').write(base64.b64decode(data))"
          openssl ec -in "${ORIGINAL_PATH}" -out "${CONVERTED_PATH}"
          echo "ASC_KEY_FILEPATH=$(pwd)/${CONVERTED_PATH}" >> "$GITHUB_ENV"

      - name: 인증서 1회 생성 후 .p12로 내보내기
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          CERT_EXPORT_PASSWORD: ${{ github.event.inputs.cert_password }}
        run: bundle exec fastlane bootstrap_cert

      - name: .p12 파일을 아티팩트로 업로드
        uses: actions/upload-artifact@v4
        with:
          name: distribution-cert
          path: distribution.p12
          retention-days: 1
