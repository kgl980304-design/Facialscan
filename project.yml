name: FacialScanCalib
options:
  bundleIdPrefix: com.facialscancalib
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  postGenCommand: sed -i.bak -E 's|objectVersion = [0-9]+|objectVersion = 60|' FacialScanCalib.xcodeproj/project.pbxproj

configs:
  Debug: debug
  Release: release

targets:
  FacialScanCalib:
    type: application
    platform: iOS
    sources:
      - path: FacialScanCalib
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: "FacialScanCalib"
        NSCameraUsageDescription: "안면 스캔 및 체커보드 교정을 위해 카메라 접근이 필요합니다."
        UIRequiredDeviceCapabilities: [arm64]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.facialscancalib.app
        SWIFT_OBJC_BRIDGING_HEADER: FacialScanCalib/OpenCVBridge/FacialScanCalib-Bridging-Header.h
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        ENABLE_BITCODE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "FacialScanCalib AppStore CI"
